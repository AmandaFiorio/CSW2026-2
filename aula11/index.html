<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Exercício de Fontes</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora&family=Open+Sans&family=Sedan&display=swap" rel="stylesheet">

    <style>
        body {
            background-color: #F1EBCB;
            color: #436A6F; 
            margin: 0;
            padding: 30px 20px;
        }

        .parte-1, .parte-2 {
            background-color: #ffffff;
            border: 3px solid #61888C;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 4px 10px rgba(67, 106, 111, 0.15);
        }

        .parte-1 h2:first-child, .parte-2 h2:first-child {
            border-bottom: 2px solid #AEBDA7;
            padding-bottom: 10px;
            margin-top: 0;
        }

        .btn-avancar {
            display: inline-block;
            margin-bottom: 25px;
            padding: 10px 18px;
            background-color: #BDAA83;
            color: #ffffff;
            text-decoration: none;
            font-weight: bold;
            border-radius: 6px;
            border: 2px solid #436A6F;
            font-family: Arial, Helvetica, sans-serif; 
            transition: all 0.2s ease-in-out;
        }

        .btn-avancar:hover {
            background-color: #436A6F;
            color: #F1EBCB;
        }

        hr {
            display: none;
        }

    </style>

    <style>
        .parte-1 h5 {
            font-family: 'Sedan', serif;
        }
        .parte-1 h6 {
            font-family: 'Open Sans', sans-serif;
        }
        .parte-1 p {
            font-family: 'Lora', serif;
        }

        @font-face {
            font-family: 'Top Secret';
            src: url('./fontes/top_secret.otf') format('truetype');
        }

        @font-face {
            font-family: 'Gimme Danger';
            src: url('./fontes/Gimme\ Danger.ttf') format('truetype');
        }

        @font-face {
            font-family: 'LL Cooper';
            src: url('./fontes/LLCOOPER.TTF') format('truetype');
        }

        .parte-2 h4 {
            font-family: 'Top Secret', sans-serif;
        }
        .parte-2 h5 {
            font-family: 'Gimme Danger', sans-serif;
        }
        .parte-2 h6 {
            font-family: 'll cooper', sans-serif;
        }
    </style>
</head>
<body>

    <section class="parte-1">
        <h1>Parte 1 - Google Fonts </h1>
        <h5>Sedan</h5>
        <h6>Open Sans</h6>
        <p>Lora</p>
    </section>

    <hr>

    <section class="parte-2">
        <h1>Parte 2 - Download de fontes</h1>
        <h4>Top Secret</h4>
        <h5>Gimme Danger</h5>
        <h6>LL Cooper</h6>
    </section>

    <a href="paginadois.html" class="btn-avancar">Ir para a Página Dois →</a>
</body>
</html>
